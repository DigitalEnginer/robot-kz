<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Панель лидов | XBOT Robotics Kazakhstan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #07090e;
      --bg-card: #0e131f;
      --bg-card-hover: #141c2e;
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(0, 245, 160, 0.3);
      --accent-mint: #00f5a0;
      --accent-cyan: #00d2ff;
      --accent-amber: #f59e0b;
      --accent-purple: #a855f7;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --status-new: #38bdf8;
      --status-work: #f59e0b;
      --status-test: #a855f7;
      --status-done: #10b981;
      --status-cancel: #ef4444;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-badge {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #00f5a0, #00d2ff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 800;
      font-size: 1.3rem;
      box-shadow: 0 0 20px rgba(0, 245, 160, 0.4);
    }

    .logo-title h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .logo-title p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-mint), var(--accent-cyan));
      color: #000;
    }

    .btn-primary:hover {
      box-shadow: 0 0 16px rgba(0, 245, 160, 0.4);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* STATS KPI */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--accent-mint);
    }

    .stat-card.new::before { background: var(--status-new); }
    .stat-card.work::before { background: var(--status-work); }
    .stat-card.test::before { background: var(--status-test); }
    .stat-card.done::before { background: var(--status-done); }

    .stat-label {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .stat-val {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      font-family: var(--font-mono);
    }

    /* CONTROLS BAR */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px 10px 38px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent-mint);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .filter-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .pill:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .pill.active {
      background: rgba(0, 245, 160, 0.12);
      border-color: var(--accent-mint);
      color: var(--accent-mint);
    }

    /* TABLE */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
    }

    td {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: var(--bg-card-hover);
    }

    .lead-client {
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lead-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .phone-link {
      color: var(--accent-cyan);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    .phone-link:hover {
      text-decoration: underline;
    }

    .city-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.78rem;
      color: #cbd5e1;
    }

    .robot-tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(0, 245, 160, 0.1);
      color: var(--accent-mint);
      border: 1px solid rgba(0, 245, 160, 0.2);
      font-size: 0.78rem;
      font-weight: 600;
      margin: 2px;
    }

    .status-select {
      background: #07090e;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .status-select:focus {
      border-color: var(--accent-mint);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .status-badge.новый { background: rgba(56, 189, 248, 0.15); color: var(--status-new); }
    .status-badge.в-работе { background: rgba(245, 158, 11, 0.15); color: var(--status-work); }
    .status-badge.тест-драйв-назначен { background: rgba(168, 85, 247, 0.15); color: var(--status-test); }
    .status-badge.сделка-закрыта { background: rgba(16, 185, 129, 0.15); color: var(--status-done); }
    .status-badge.отклонен { background: rgba(239, 68, 68, 0.15); color: var(--status-cancel); }

    .wa-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      background: #25d366;
      color: #000;
      font-weight: 700;
      font-size: 0.8rem;
      text-decoration: none;
      transition: all 0.2s;
    }

    .wa-btn:hover {
      box-shadow: 0 0 12px rgba(37, 211, 102, 0.5);
      transform: translateY(-1px);
    }

    .budget-val {
      font-family: var(--font-mono);
      font-weight: 600;
      color: #e2e8f0;
    }

    /* EMPTY STATE */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #111827;
      border: 1px solid var(--accent-mint);
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 900px) {
      .table-container {
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-area">
        <div class="logo-badge">X</div>
        <div class="logo-title">
          <h1>XBOT CRM — Заявки клиентов РК</h1>
          <p>Оперативная маршрутизация лидов по роботам Unitree & PUDU</p>
        </div>
      </div>
      <div class="header-actions">
        <a href="/" target="_blank" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>
          Открыть сайт
        </a>
        <button id="refreshBtn" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          Обновить
        </button>
        <button id="exportBtn" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Экспорт JSON
        </button>
      </div>
    </header>

    <!-- KPI STATS -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Всего заявок</div>
        <div class="stat-val" id="statTotal">0</div>
      </div>
      <div class="stat-card new">
        <div class="stat-label">Новые (срочные)</div>
        <div class="stat-val" id="statNew" style="color: var(--status-new);">0</div>
      </div>
      <div class="stat-card work">
        <div class="stat-label">В работе</div>
        <div class="stat-val" id="statWork" style="color: var(--status-work);">0</div>
      </div>
      <div class="stat-card test">
        <div class="stat-label">Тест-драйв назначен</div>
        <div class="stat-val" id="statTest" style="color: var(--status-test);">0</div>
      </div>
      <div class="stat-card done">
        <div class="stat-label">Сделки закрыты</div>
        <div class="stat-val" id="statDone" style="color: var(--status-done);">0</div>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls-bar">
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Поиск по имени, телефону, компании или городу...">
      </div>
      <div class="filter-pills" id="filterPills">
        <button class="pill active" data-filter="all">Все заявки</button>
        <button class="pill" data-filter="Новый">Новые</button>
        <button class="pill" data-filter="В работе">В работе</button>
        <button class="pill" data-filter="Тест-драйв назначен">Тест-драйв</button>
        <button class="pill" data-filter="Сделка закрыта">Сделка закрыта</button>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Дата / ID</th>
            <th>Клиент / Компания</th>
            <th>Контакты</th>
            <th>Город</th>
            <th>Интересующие роботы</th>
            <th>Бюджет</th>
            <th>Статус</th>
            <th>Действие</th>
          </tr>
        </thead>
        <tbody id="leadsTableBody">
          <tr>
            <td colspan="8" class="empty-state">Загрузка данных CRM...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let allLeads = [];
    let currentFilter = 'all';
    let searchQuery = '';

    const tableBody = document.getElementById('leadsTableBody');
    const searchInput = document.getElementById('searchInput');
    const filterPills = document.querySelectorAll('#filterPills .pill');
    const refreshBtn = document.getElementById('refreshBtn');
    const exportBtn = document.getElementById('exportBtn');

    // KPI elements
    const statTotal = document.getElementById('statTotal');
    const statNew = document.getElementById('statNew');
    const statWork = document.getElementById('statWork');
    const statTest = document.getElementById('statTest');
    const statDone = document.getElementById('statDone');

    async function loadLeads() {
      try {
        const res = await fetch('/api/leads');
        const data = await res.json();
        allLeads = data.leads || [];
        updateKPIs();
        renderTable();
      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="8" class="empty-state" style="color: #ef4444;">Ошибка подключения к API: ${err.message}</td></tr>`;
      }
    }

    function updateKPIs() {
      statTotal.textContent = allLeads.length;
      statNew.textContent = allLeads.filter(l => l.status === 'Новый').length;
      statWork.textContent = allLeads.filter(l => l.status === 'В работе').length;
      statTest.textContent = allLeads.filter(l => l.status === 'Тест-драйв назначен').length;
      statDone.textContent = allLeads.filter(l => l.status === 'Сделка закрыта').length;
    }

    function renderTable() {
      let filtered = [...allLeads];

      if (currentFilter !== 'all') {
        filtered = filtered.filter(l => l.status === currentFilter);
      }

      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase().trim();
        filtered = filtered.filter(l => 
          (l.name && l.name.toLowerCase().includes(q)) ||
          (l.phone && l.phone.toLowerCase().includes(q)) ||
          (l.company && l.company.toLowerCase().includes(q)) ||
          (l.city && l.city.toLowerCase().includes(q)) ||
          (Array.isArray(l.robots) ? l.robots.join(' ').toLowerCase().includes(q) : (l.robots || '').toLowerCase().includes(q))
        );
      }

      if (filtered.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="8" class="empty-state">Нет заявок по заданным критериям</td></tr>`;
        return;
      }

      tableBody.innerHTML = filtered.map(lead => {
        const dateStr = lead.createdAt ? new Date(lead.createdAt).toLocaleString('ru-RU', {
          day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
        }) : '—';

        const cleanPhone = (lead.phone || '').replace(/[^0-9]/g, '');
        const targetPhone = cleanPhone.startsWith('8') ? '7' + cleanPhone.slice(1) : cleanPhone;
        
        let robotsHtml = '—';
        if (Array.isArray(lead.robots) && lead.robots.length > 0) {
          robotsHtml = lead.robots.map(r => `<span class="robot-tag">${escapeHtml(typeof r === 'object' ? r.name : r)}</span>`).join('');
        } else if (typeof lead.robots === 'string' && lead.robots.trim()) {
          robotsHtml = `<span class="robot-tag">${escapeHtml(lead.robots)}</span>`;
        }

        const msgText = encodeURIComponent(
          `Здравствуйте, ${lead.name || 'уважаемый клиент'}! Мы получили вашу заявку на официальном сайте XBOT Robotics Kazakhstan касательно ${Array.isArray(lead.robots) ? lead.robots.join(', ') : (lead.robots || 'робототехники')}. Меня зовут менеджер XBOT. Удобно обсудить детали поставки?`
        );
        const waLink = `https://wa.me/${targetPhone}?text=${msgText}`;

        return `
          <tr>
            <td>
              <div style="font-weight: 600; color: #fff;">${dateStr}</div>
              <div class="lead-meta" style="font-family: var(--font-mono); font-size: 0.72rem;">${lead.id || ''}</div>
            </td>
            <td>
              <div class="lead-client">${escapeHtml(lead.name || 'Без имени')}</div>
              <div class="lead-meta">${escapeHtml(lead.company || 'Частное лицо / Компания не указана')}</div>
            </td>
            <td>
              <a href="tel:${cleanPhone}" class="phone-link">${escapeHtml(lead.phone || '—')}</a>
              <div class="lead-meta">Канал: ${escapeHtml(lead.contactMethod || 'WhatsApp')}</div>
            </td>
            <td>
              <span class="city-badge">${escapeHtml(lead.city || 'Алматы')}</span>
            </td>
            <td>
              <div style="max-width: 240px; display: flex; flex-wrap: wrap;">${robotsHtml}</div>
              ${lead.comment ? `<div class="lead-meta" style="margin-top: 4px; font-style: italic;">"${escapeHtml(lead.comment)}"</div>` : ''}
            </td>
            <td>
              <span class="budget-val">${escapeHtml(lead.budget || 'По запросу')}</span>
            </td>
            <td>
              <select class="status-select" onchange="updateLeadStatus('${lead.id}', this.value)">
                <option value="Новый" ${lead.status === 'Новый' ? 'selected' : ''}>Новый</option>
                <option value="В работе" ${lead.status === 'В работе' ? 'selected' : ''}>В работе</option>
                <option value="Тест-драйв назначен" ${lead.status === 'Тест-драйв назначен' ? 'selected' : ''}>Тест-драйв назначен</option>
                <option value="Сделка закрыта" ${lead.status === 'Сделка закрыта' ? 'selected' : ''}>Сделка закрыта</option>
                <option value="Отклонен" ${lead.status === 'Отклонен' ? 'selected' : ''}>Отклонен</option>
              </select>
            </td>
            <td>
              <a href="${waLink}" target="_blank" class="wa-btn" title="Написать клиенту в WhatsApp">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.664-.698c.983.541 1.836.828 2.801.829l.005-.001c3.182 0 5.767-2.587 5.768-5.766 0-3.18-2.586-5.765-5.778-5.765zm9.969 5.768c0 5.518-4.482 10-10 10-1.705 0-3.32-.435-4.735-1.196l-5.265 1.381 1.405-5.132c-.859-1.488-1.355-3.218-1.355-5.053 0-5.518 4.482-10 10-10 5.518 0 10 4.482 10 10z"/></svg>
                WhatsApp
              </a>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function updateLeadStatus(id, newStatus) {
      try {
        const res = await fetch(`/api/leads/${id}/status`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        const result = await res.json();
        if (result.success) {
          showToast(`Статус лида ${id.slice(-6)} изменён на "${newStatus}"`);
          const idx = allLeads.findIndex(l => l.id === id);
          if (idx !== -1) allLeads[idx].status = newStatus;
          updateKPIs();
        } else {
          showToast('Ошибка обновления статуса: ' + (result.error || 'Unknown'));
        }
      } catch (err) {
        showToast('Сетевая ошибка при обновлении статуса');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Event listeners
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderTable();
    });

    filterPills.forEach(pill => {
      pill.addEventListener('click', () => {
        filterPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentFilter = pill.dataset.filter;
        renderTable();
      });
    });

    refreshBtn.addEventListener('click', () => {
      loadLeads();
      showToast('Список заявок обновлён');
    });

    exportBtn.addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(allLeads, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `xbot-leads-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // Auto-refresh every 30 seconds
    setInterval(loadLeads, 30000);

    // Initial load
    loadLeads();
  </script>
</body>
</html>
